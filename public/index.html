<!DOCTYPE html>
<html lang="en" data-theme="dark" data-scanlines="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amrit Dash · amrit.os</title>
  <meta name="description" content="Portfolio of Amrit Dash — Software Engineer specializing in automation, Flutter and Google Cloud. Reimagined as a retro operating system." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=VT323&display=swap" rel="stylesheet" />

  <!-- Theme init: apply before first paint so the boot splash never flashes.
       Mirrors the logic in data.jsx but runs synchronously in <head> — before
       Babel compiles the JSX and before any stylesheet renders. -->
  <script>
    (function () {
      var root = document.documentElement;
      var isPreview = location.search.indexOf('adminpreview') !== -1;

      // 1. User's explicit toggle wins (not applicable in admin preview)
      try {
        var explicit = localStorage.getItem('amritos.theme.explicit') === '1';
        var stored = localStorage.getItem('amritos.theme');
        if (!isPreview && explicit && (stored === 'light' || stored === 'dark')) {
          root.dataset.theme = stored;
          return;
        }
      } catch (e) {}

      // 2. Fall back to admin's Firestore-published theme (cached in localStorage)
      try {
        var raw = localStorage.getItem('amritos.published.cache') ||
                  localStorage.getItem('amritos.published');
        if (raw) {
          var cos = (JSON.parse(raw) || {}).cosmetics || {};
          if (cos.theme === 'light' || cos.theme === 'dark') {
            root.dataset.theme = cos.theme;
          }
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <!-- Front-end portfolio: pixel "AD" monogram app-tile (distinct from the admin's
       terminal-window mark). First-paint fallback at the default accent;
       data.jsx/app.jsx re-tint it to the live accent so it changes with the theme. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' shape-rendering='crispEdges'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d0a'/%3E%3Cg fill='%23c8e856'%3E%3Crect x='5' y='9' width='8' height='2'/%3E%3Crect x='3' y='11' width='4' height='2'/%3E%3Crect x='11' y='11' width='4' height='2'/%3E%3Crect x='3' y='13' width='4' height='2'/%3E%3Crect x='11' y='13' width='4' height='2'/%3E%3Crect x='3' y='15' width='12' height='2'/%3E%3Crect x='3' y='17' width='4' height='2'/%3E%3Crect x='11' y='17' width='4' height='2'/%3E%3Crect x='3' y='19' width='4' height='2'/%3E%3Crect x='11' y='19' width='4' height='2'/%3E%3Crect x='3' y='21' width='4' height='2'/%3E%3Crect x='11' y='21' width='4' height='2'/%3E%3Crect x='17' y='9' width='10' height='2'/%3E%3Crect x='17' y='11' width='4' height='2'/%3E%3Crect x='25' y='11' width='4' height='2'/%3E%3Crect x='17' y='13' width='4' height='2'/%3E%3Crect x='25' y='13' width='4' height='2'/%3E%3Crect x='17' y='15' width='4' height='2'/%3E%3Crect x='25' y='15' width='4' height='2'/%3E%3Crect x='17' y='17' width='4' height='2'/%3E%3Crect x='25' y='17' width='4' height='2'/%3E%3Crect x='17' y='19' width='4' height='2'/%3E%3Crect x='25' y='19' width='4' height='2'/%3E%3Crect x='17' y='21' width='10' height='2'/%3E%3C/g%3E%3C/svg%3E" />
</head>
<body style="font-family: &quot;Space Grotesk&quot;">

  <div id="root"></div>

  <!-- Firebase (compat) — powers live content, the bot proxy and analytics.
       Must load before firebase-init.js and the app scripts. -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- App scripts (Babel JSX). Order matters: data → md → tweaks shell → app. -->
  <script type="text/babel" data-presets="env,react" src="data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="md.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="tweaks-panel.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app.jsx"></script>

  <!-- Reveal-on-scroll observer (runs once, outside React). Detects frozen
       timelines (preview/print) and skips animations in that case. -->
  <script>
    (function() {
      let armed = false;
      function arm() {
        if (armed) return;
        armed = true;
        // Detect frozen document timeline (e.g. html-to-image preview).
        // Wait one rAF then check if timeline advanced. If not, skip reveal.
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            if (!document.timeline || document.timeline.currentTime < 1) {
              // timeline is frozen — keep content visible, no animations
              return;
            }
            startReveals();
          });
        });
      }
      function startReveals() {
        document.documentElement.classList.add('js-reveal-ready');
        const reveal = (el) => el.classList.add('is-visible');
        if (!('IntersectionObserver' in window)) {
          document.querySelectorAll('[data-reveal]').forEach(reveal);
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              reveal(e.target);
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.05, rootMargin: '0px 0px 0px 0px' });
        function scan() {
          document.querySelectorAll('[data-reveal]:not(.is-visible)').forEach((el) => {
            if (!el.dataset.revealObserved) {
              el.dataset.revealObserved = '1';
              io.observe(el);
            }
          });
        }
        scan();
        const mo = new MutationObserver(scan);
        mo.observe(document.body, { childList: true, subtree: true });
        [60, 240, 600, 1200].forEach((t) => setTimeout(scan, t));
        // Hard safety net: if the IO never fires (some preview/test environments
        // throttle or never trigger initial callbacks), force-reveal anything
        // still hidden after a short grace period.
        setTimeout(function forceReveal() {
          document.querySelectorAll('[data-reveal]:not(.is-visible)').forEach(reveal);
        }, 1600);
        // And again later for anything that mounts late
        setTimeout(function forceReveal2() {
          document.querySelectorAll('[data-reveal]:not(.is-visible)').forEach(reveal);
        }, 3200);
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', arm);
      } else {
        arm();
      }
    })();
  </script>

  <!-- Random CRT flicker — JS-driven so timing is organic, not metronomic -->
  <script>
    (function () {
      function rnd(lo, hi) { return lo + Math.random() * (hi - lo); }
      var BASE = 0.05;   // matches --scanline-opacity CSS var
      var PEAK = 0.14;   // subtle peak during burst

      function burst() {
        var root = document.documentElement;
        var steps = Math.floor(rnd(2, 5)); // 2-4 rapid flashes per burst
        var i = 0;
        function step() {
          if (i >= steps) {
            root.style.setProperty('--scanline-opacity', BASE);
            schedule();
            return;
          }
          var rising = (i % 2 === 0);
          root.style.setProperty('--scanline-opacity', rising ? rnd(PEAK * 0.6, PEAK) : rnd(BASE, BASE * 2));
          i++;
          setTimeout(step, rnd(30, 90));
        }
        step();
      }

      function schedule() {
        setTimeout(burst, rnd(12000, 28000)); // 12-28 s quiet period between bursts
      }

      // Kick off after a short random delay so repeated loads feel fresh
      setTimeout(schedule, rnd(800, 2400));
    })();
  </script>

</body>
</html>
