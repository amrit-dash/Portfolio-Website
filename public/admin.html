<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>amrit.os · admin console</title>
  <meta name="description" content="Private admin console for the amrit.os portfolio — edit content, media, appearance and the AmritBot assistant." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Playfair+Display:wght@400;500;700&family=VT323&family=Roboto+Slab:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Press+Start+2P&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin/admin.css" />
  <!-- Admin console: terminal-window mark (close dots + >_ prompt). First-paint
       fallback at the default accent; app.jsx re-tints it to the console accent. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0d0a'/%3E%3Crect x='6' y='7' width='20' height='18' rx='3' fill='%23c8e856'/%3E%3Crect x='7.6' y='12.4' width='16.8' height='11' rx='1.6' fill='%230c0d0a'/%3E%3Ccircle cx='9.5' cy='9.7' r='1.05' fill='%230c0d0a'/%3E%3Ccircle cx='12.7' cy='9.7' r='1.05' fill='%230c0d0a'/%3E%3Ccircle cx='15.9' cy='9.7' r='1.05' fill='%230c0d0a'/%3E%3Cpath d='M10.3 16.4l2.2 1.9-2.2 1.9' fill='none' stroke='%23c8e856' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='14' y='19.4' width='4.6' height='1.5' rx='.75' fill='%23c8e856'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="root"></div>

  <!-- Firebase (compat SDK) — must load before firebase-init.js -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Shared enums + agent config schema (plain JS global; before data.jsx for experience date migration) -->
  <script src="shared-schema.js"></script>

  <!-- Site data (seeds the dashboard with current content) -->
  <script type="text/babel" data-presets="env,react" src="data.jsx"></script>

  <!-- Admin app (order matters: store → md → ui → crop → editors → bot → agent → app) -->
  <script type="text/babel" data-presets="env,react" src="admin/store.jsx"></script>
  <script src="md.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/ui.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/refiner.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/logs.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/inbox.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/crop.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/editors.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/editors-wp.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/provider-card.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/bot.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/agent.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/agent-settings.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/app.jsx"></script>
</body>
</html>
