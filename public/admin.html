<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>amrit.os · admin console</title>
  <meta name="description" content="Private admin console for the amrit.os portfolio — edit content, media, appearance and the AmritBot assistant." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Playfair+Display:wght@400;500;700&family=VT323&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin/admin.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c0d0a'/%3E%3Crect x='4' y='4' width='12' height='12' fill='%23c8e856'/%3E%3Crect x='16' y='16' width='12' height='12' fill='%23c8e856'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="root"></div>

  <!-- Firebase (compat SDK) — must load before firebase-init.js -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-init.js"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Site data (seeds the dashboard with current content) -->
  <script type="text/babel" data-presets="env,react" src="data.jsx"></script>

  <!-- Admin app (order matters: store → ui → crop → editors → bot → app) -->
  <script type="text/babel" data-presets="env,react" src="admin/store.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/ui.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/crop.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/editors.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/editors-wp.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/bot.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="admin/app.jsx"></script>
</body>
</html>
