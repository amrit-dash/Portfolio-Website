name: Deploy site (amritdash)

# Deploys ONLY the public portfolio (hosting:amritdash) when site-facing files
# change on amrit-os. Admin-only changes are handled by deploy-admin.yml.
# Shared sources (data.jsx, firebase-config.js, firebase-init.js, the build
# script, firebase.json) live under public/** or the repo root and are included
# here AND in the admin workflow, so a shared change redeploys both sites.
# The vanilla v1 on amrit-dash-portfolio.web.app is never a target — it stays preserved.
on:
  push:
    branches:
      - amrit-os
    paths:
      - 'public/**'
      - '!public/admin/**'
      - '!public/admin.html'
      - 'scripts/build-dist.mjs'
      - 'firebase.json'
      - '.firebaserc'
      - 'package.json'
      - '.github/workflows/deploy-site.yml'

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  build_and_deploy_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - run: npm ci

      - run: npm install -g firebase-tools

      # Assembles both bundles; only dist/site is used by this deploy.
      - run: npm run build

      - run: firebase deploy --only hosting:amritdash --project amrit-dash-portfolio
