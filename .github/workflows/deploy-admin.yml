name: Deploy admin (amritos-admin)

# Deploys ONLY the admin console (hosting:amritos-admin) when admin files change
# on master. Site-only changes are handled by deploy-site.yml.
# Shared sources are listed here too (data.jsx, firebase-config.js,
# firebase-init.js, the build script, firebase.json), because the admin bundle
# embeds them — so a shared change redeploys the admin alongside the site.
on:
  push:
    branches:
      - master
    paths:
      - 'public/admin/**'
      - 'public/admin.html'
      - 'public/data.jsx'
      - 'public/firebase-config.js'
      - 'public/firebase-init.js'
      - 'scripts/build-dist.mjs'
      - 'firebase.json'
      - '.firebaserc'
      - 'package.json'
      - '.github/workflows/deploy-admin.yml'

concurrency:
  group: deploy-admin
  cancel-in-progress: false

jobs:
  build_and_deploy_admin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - run: npm install -g firebase-tools

      # Assembles both bundles; only dist/admin is used by this deploy.
      - run: npm run build

      - run: firebase deploy --only hosting:amritos-admin --project amrit-dash-portfolio
