name: Deploy backend (functions + rules)

# MANUAL ONLY. Deploys Cloud Functions + Firestore rules + Storage rules.
# There is intentionally NO push trigger — the backend deploy cadence is owner-
# controlled (the agent adds new endpoints, so we don't want it firing on every
# amrit-os merge). Run it from the Actions tab via "Run workflow".
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'firebase deploy --only targets'
        required: true
        default: 'functions,firestore:rules,storage'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - run: npm install -g firebase-tools

      # Install function deps so the functions deploy bundles them.
      - run: npm ci --prefix functions || npm install --prefix functions

      - run: firebase deploy --only "${{ github.event.inputs.targets }}" --project amrit-dash-portfolio
